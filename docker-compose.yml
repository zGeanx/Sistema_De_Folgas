version: '3.8'

services:
  db:
    image: postgres:15
    container_name: folgas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - folgas_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: folgas_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      - db
    networks:
      - folgas_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: folgas_frontend
    command: npm start
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - folgas_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  folgas_network:
    driver: bridge
